[workspace]
resolver = "2"
members = ["crates/github", "crates/terminal"]

[workspace.dependencies]
anyhow = "1.0.100"
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
chrono = { version = "0.4.38", features = ["clock", "serde"] }
chrono-humanize = "0.2.3"
testresult = "0.4.1"
futures-util = "0.3.31"
