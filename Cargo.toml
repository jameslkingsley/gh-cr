[package]
name = "gh-cr"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
crossterm = "0.29.0"
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
dirs-next = "2.0.0"
tempfile = "3.12.0"
clap = { version = "4.5.18", features = ["derive"] }
textwrap = "0.16.1"
chrono = { version = "0.4.38", features = ["clock", "serde"] }
chrono-humanize = "0.2.3"
octocrab = "0.48.0"
testresult = "0.4.1"
bytes = "1.11.0"
futures-util = "0.3.31"
http = "1.3.1"
hyper = "1.8.1"
tower = "0.5.2"
http-body = "1.0.1"
http-body-util = "0.1.3"
